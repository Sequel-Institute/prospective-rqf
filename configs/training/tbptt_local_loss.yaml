name: tbptt_local_loss
# Spatial-only backpropagation: the recurrent state is detached at each step
# (TBPTT(1)); gradients still flow through the within-step spatial chain across
# layers and use a local per-step loss.
scan_grad_mode: tbptt1
per_step_loss: true
pooling: mean
tbptt_delayed_input_mode: strict
batch_size: 32
max_epochs: 300
patience: 20
learning_rate: 0.001
weight_decay: 0.0001
rqf_lr_factor: 0.1
label_smoothing: 0.1
gradient_clip_val: 1.0
min_lr: 0.000001
