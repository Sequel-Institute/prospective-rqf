name: s4d
encoder: s4d
depth: 2
hidden_width: 48
output_dims: 64
skip_connection: false
prospective_input: false

encoder_kwargs:
  d_state: 64
  dropout: 0.0
  dt_min: 0.001
  dt_max: 0.1
  kernel_init: diag-inv
  activation: gelu
  glu: true
  prenorm: true
  bidirectional: false

classifier:
  hidden_dims: 256
  activation: gelu
  dropout: 0.1
