name: rqf_s4
encoder: rqf_s4
depth: 2
hidden_width: 48
output_dims: 64
skip_connection: false
prospective_input: false
prospective_mode: tau
prospective_tau: null

encoder_kwargs:
  num_filters: 32
  samp_frequency: 16000.0
  min_freq: 1.0
  max_freq: 8000.0
  tau: 0.000125
  min_gamma: 0.001
  max_gamma: 1.0
  learn_tau: false
  discretization: zoh
  activation: gelu
  dropout: 0.0
  bidirectional: false
  expand_factor: 2
  norm_type: batch
  readout_mode: real
  num_oscillators: 1
  use_glu: true
  clamp_gamma: true
  c_projection: true
  sigma_init: 0.1

mfcc_encoder_kwargs:
  samp_frequency: 160.0
  min_freq: 0.01
  max_freq: 80.0
  tau: 0.0625

classifier:
  hidden_dims: 256
  activation: gelu
  dropout: 0.1

