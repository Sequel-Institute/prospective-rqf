[project]
name = "rqf-speech-commands"
version = "0.0.0"
description = "RQF, RQF-S4, and discrete ORGaNICs Speech Commands training code"
requires-python = ">=3.10"
dependencies = [
    "hydra-core",
    "numpy",
    "omegaconf",
    "Pillow",
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "tqdm",
]

[tool.setuptools.packages.find]
include = ["rqf_models*"]
